[project]
name = "litmus-mcp-server"
version = "1.3.0"
description = "Litmus MCP Server"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=24.1.0",
    "fastapi>=0.115.12",
    "httpx>=0.28.0",
    "influxdb>=5.3.2",
    "jinja2>=3.1.6",
    "litmussdk",
    "mcp[cli]>=1.28.1,<2",
    "nats-py>=2.11.0",
    "numpy>=2.3.4",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.31",
]

[dependency-groups]
cve-patches = [
    "h11>=0.16.0",
    "cryptography>=48.0.1"
]
lint = [
    "black>=25.9.0",
    "radon>=6.0.1",
    "ruff>=0.14.0",
]
llm-sdks = [
    "anthropic>=0.49.0",
    "google-genai>=1.0",
    "openai-agents>=0.0.13",
]
test = [
    "pytest>=9.0.3",
    ]


[tool.uv.sources]
litmussdk = { url = "https://github.com/litmusautomation/litmus-sdk-releases/releases/download/2.7.4/litmussdk-2.7.4-py3-none-any.whl" }

[tool.ruff]
exclude = [
    ".venv",
    "venv",
    "site-packages",
    "build",
    "dist",
    ".pytest_cache",
    ".ruff_cache",
    "__init__.py",
    "dev_tests"
]
line-length = 88
indent-width = 4

[tool.ruff.lint]
# Selected explicitly rather than relying on ruff's defaults: those changed in
# ruff 0.16 (new families added, pycodestyle E4 dropped) and broke CI, which
# ran an unpinned `uvx ruff`. E4/E7/E9/F was the effective set before; the rest
# are deliberate additions covering the mechanically enforceable rules 0.16
# surfaced. The judgment-heavy families it also added (BLE, S, SIM, TRY, G,
# LOG, ASYNC, DTZ, PLW) are not enabled yet; adopting them needs a per-site
# review, mostly of blind `except Exception` handlers.
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF", "FURB", "PLR0402"]

[tool.ruff.lint.pydocstyle]
convention = "google"
